<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شهادة إتمام الكورس - LINGO GO</title>
    <style>
        body { background: #080c14; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 30px; display: flex; flex-direction: column; justify-content: center; min-height: 100vh; }
        .cert-box { border: 4px solid #d4af37; padding: 30px 20px; border-radius: 15px; background: #0f172a; max-width: 600px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { color: #d4af37; margin-bottom: 15px; font-size: 24px; }
        h2 { color: #38bdf8; margin: 15px 0; font-size: 22px; border-bottom: 2px solid #334155; display: inline-block; padding-bottom: 5px; }
        p { font-size: 15px; color: #cbd5e1; line-height: 1.6; }
        .back-btn { display: inline-block; margin-top: 25px; padding: 10px 20px; background: #3b82f6; color: #fff; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div class="cert-box">
        <h1>🎓 شهادة إتمام الكورس المعتمدة 🎓</h1>
        <p>تمنح هذه الشهادة بكل فخر واعتزاز إلى الطالب المتميز:</p>
        <h2>{{ student_name }}</h2>
        <p>لاجتيازه كافة دروس ومستويات منصة LINGO GO ACADEMY بنجاح وتفوق تام.</p>
        <a href="/" class="back-btn">العودة للمنصة الرئيسية 🔙</a>
    </div>
</body>
</html>
